# Build a glibc headless tarball for the Termux proot path.
# This does not create a GitHub Release and does not touch updater.json.
name: Headless bundle

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "src/**"
      - "src-tauri/**"
      - "package.json"
      - "package-lock.json"
      - "scripts/build-headless-bundle.sh"
      - "scripts/termux/**"
      - "docs/android-termux.md"
      - ".github/workflows/headless-bundle.yml"

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  bundle:
    name: linux aarch64 headless bundle
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 120
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential curl wget file pkg-config patchelf git \
            libssl-dev libgtk-3-dev libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev librsvg2-dev \
            libsoup-3.0-dev javascriptcoregtk-4.1 libjavascriptcoregtk-4.1-dev \
            perl cmake golang-go clang libclang-dev

      - name: Rust setup
        uses: dtolnay/rust-toolchain@stable

      - name: Node.js setup
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Build the bundle
        run: bash scripts/build-headless-bundle.sh

      - name: Upload headless bundle
        uses: actions/upload-artifact@v4
        with:
          name: antigravity-headless-linux-aarch64
          path: dist-bundles/antigravity-headless-linux-aarch64.tar.gz
          if-no-files-found: error
          retention-days: 14
